# Applicant operations are public (@auth scope PUBLIC): applicants aren't
# logged in yet. Inputs are validated and rate limited in node/.
#
# Review operations are for admins only. They borrow VTEX's documented example
# resource (product 66 "VTEX IO", resource workspace-read-write) until the
# reviewer permission is settled in Phase 3. See B2B-C11-PLAN.md.

type Query {
  "An applicant checks their application with the reference and code they got on submission"
  applicationStatus(reference: String!, token: String!): ApplicantView
    @auth(scope: PUBLIC)
    @cacheControl(scope: PRIVATE)

  onboardingApplications(
    status: ApplicationStatus
    page: Int = 1
    pageSize: Int = 20
  ): ApplicationPage
    @auth(scope: PRIVATE, productCode: "66", resourceCode: "workspace-read-write")
    @cacheControl(scope: PRIVATE)

  onboardingApplication(id: ID!): Application
    @auth(scope: PRIVATE, productCode: "66", resourceCode: "workspace-read-write")
    @cacheControl(scope: PRIVATE)

  "The approval stages new applications follow, from app settings"
  onboardingStages: StageConfig
    @auth(scope: PRIVATE, productCode: "66", resourceCode: "workspace-read-write")
    @cacheControl(scope: PRIVATE)
}

type Mutation {
  submitApplication(input: ApplicationInput!): SubmissionReceipt
    @auth(scope: PUBLIC)

  "Runs the eligibility check on the application's verification stage"
  runVerification(id: ID!, stageId: ID!): Application
    @auth(scope: PRIVATE, productCode: "66", resourceCode: "workspace-read-write")

  """
  Passes or rejects the application's current stage. stageId must be the stage
  the reviewer saw, so two reviewers can't act on different stages. Passing the
  final APPROVAL stage creates the organization in B2B Organizations.
  """
  decideStage(
    id: ID!
    stageId: ID!
    decision: StageDecision!
    "Required to reject. Shown to the applicant."
    reason: String
    "Internal. Never shown to the applicant."
    note: String
  ): Application
    @auth(scope: PRIVATE, productCode: "66", resourceCode: "workspace-read-write")
}
